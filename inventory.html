async function master(cb){return cb();if(S.mu)return cb();await ready;const a=await getAuth(),first=!a.master,o=modal("<h3>🔐 "+T(first?"mc1":"mc2")+'</h3><input class="pw" id="mi" type="password" inputmode="numeric" placeholder="••••"><div class="err" id="me"></div><div class="mb"><button class="btn" id="c">'+T("no")+'</button><button class="btn p" id="y">'+T("en")+"</button></div>");
 o.querySelector("#c").onclick=()=>o.remove();o.querySelector("#y").onclick=async()=>{const v=o.querySelector("#mi").value.trim();if(!v)return;const h=await hash("m:"+v);if(first){a.master=h;await setAuth(a)}else if(a.master!=h){o.querySelector("#me").textContent=T("mbad");return}S.mu=true;o.remove();cb()}}

async function layout(brs){const ds=[];for(const b of brs)ds.push(b==S.br&&S.d?S.d:await build(b,S.y,S.m));const w=brs.length,tot=brs.map(()=>0);
 const line=f=>{const o=[];brs.forEach((b,k)=>{if(k)o.push("");o.push(...f(b,ds[k],k))});return o},E6=Array(6).fill("");
 const a=[["WAZZUPDOG  -  تقرير الجرد الشهري (Monthly Inventory Report)  -  "+MN[S.m-1]+" / "+ME[S.m-1]+" "+S.y],[]];
 a.push(line(b=>[b=="j"?"JUFFAIR - الجفير":"HAMALA - الهملة",...E6]).concat(w>1?["TOTAL"]:[]));
 a.push(line(()=>["#","Food Item - الصنف","Opening Stock","Unit","Unit Price (BD)","Total Value (BD)","Notes"]).concat(w>1?["TOTAL (BD)"]:[]));
 CATS.forEach((c,k)=>{if(!IT.some(i=>i[3]==k))return;a.push(line(()=>[c[0],...E6]).concat(w>1?[""]:[]));IT.filter(i=>i[3]==k).forEach(i=>{let s=0;const l=line((b,d,n)=>{const r=d.r[i[0]],q=calc(r);s+=q.v;tot[n]+=q.v;return[i[0],i[1],q.s,i[2],+r[3]||0,+f3(q.v),r[4]||""]});a.push(l.concat(w>1?[+f3(s)]:[]))})});
 a.push(line((b,d,n)=>["TOTAL INVENTORY VALUE - إجمالي قيمة الجرد","","","","",+f3(tot[n]),""]).concat(w>1?[+f3(tot.reduce((x,y)=>x+y))]:[]));
 const cw=[5,30,13,8,14,15,22],wd=[];brs.forEach((b,k)=>{if(k)wd.push({wch:3});cw.forEach(x=>wd.push({wch:x}))});if(w>1)wd.push({wch:14});return{a,wd}}
async function aoaFor(b){const d=b==S.br&&S.d?S.d:await build(b,S.y,S.m),a=[["#","Item","Unit","Opening","Purchases","Closing count","Usage","Unit price (BD)","Value (BD)","Notes"]];let tot=0;
 CATS.forEach((c,k)=>{if(!IT.some(i=>i[3]==k))return;a.push([c[0]]);IT.filter(i=>i[3]==k).forEach(i=>{const r=d.r[i[0]],q=calc(r);tot+=q.v;a.push([i[0],i[1],i[2],+r[0]||0,r[1]===""?"":+r[1],r[2]===""?"":+r[2],q.u,+r[3]||0,+f3(q.v),r[4]||""])})});a.push(["","TOTAL","","","","","","",+f3(tot),""]);return a}
async function save(name,blob){try{const dl=window.claude&&await claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});return}}catch(e){if(e&&e.code=="declined")return}const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click()}
const fn=()=>"WazzupDog_Inventory_"+S.y+"-"+pad(S.m);
async function xl(){await flush();const wb=XLSX.utils.book_new(),bs=S.role=="admin"||S.role=="acc"?["j","h"]:[S.role],{a,wd}=await layout(bs),ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=wd;ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:wd.length-1}}];XLSX.utils.book_append_sheet(wb,ws,"Inventory Report");
 for(const b of bs){const x=XLSX.utils.aoa_to_sheet(await aoaFor(b));x["!cols"]=[5,30,8,10,10,12,10,12,12,24].map(wch=>({wch}));XLSX.utils.book_append_sheet(wb,x,BN[b]+" Details")}
 await save(fn()+".xlsx",new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/octet-stream"}))}
async function pdf(){await flush();const{a}=await layout(S.br=="t"?["j","h"]:[S.br]),rep=$("#rep"),n=a[3].length,nf=c=>typeof c=="number"&&!Number.isInteger(c)?c.toFixed(3):c;
 rep.innerHTML='<div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #E9B649;padding-bottom:8px;margin-bottom:10px"><img src="'+LOGO+'" style="width:60px;height:60px;border-radius:50%"><div><div style="font-size:19px;font-weight:800">Wazzup Dog — '+L.ar.rt+" / "+L.en.rt+'</div><div style="color:#666">'+(S.br=="t"?L.ar.bt+" / "+L.en.bt:L.ar.br+L.ar[S.br]+" / "+BN[S.br])+" · "+MN[S.m-1]+" / "+ME[S.m-1]+" "+S.y+"</div></div></div><table><tbody>"+a.slice(2).map((r,k)=>{const cat=k>1&&typeof r[0]=="string"&&r[1]==="";return"<tr"+(cat?' class="cr"':"")+">"+r.map(c=>(k==0||k==1?"<th>":"<td"+(cat?' style="font-weight:800"':"")+">")+nf(c)+(k<2?"</th>":"</td>")).join("")+"</tr>"}).join("")+"</tbody></table>";
 rep.style.display="block";const cv=await html2canvas(rep,{scale:2,backgroundColor:"#fff"});rep.style.display="none";const doc=new jspdf.jsPDF("l","pt","a4"),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),ph=Math.floor(cv.width*H/W);
 for(let y=0,i=0;y<cv.height;y+=ph,i++){const c=document.createElement("canvas");c.width=cv.width;c.height=Math.min(ph,cv.height-y);c.getContext("2d").drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(i)doc.addPage();doc.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,W,c.height*W/cv.width)}
 await save(fn()+"_"+(S.br=="t"?"Total":BN[S.br])+".pdf",doc.output("blob"))}
